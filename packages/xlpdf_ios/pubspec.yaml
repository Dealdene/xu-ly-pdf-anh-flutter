name: xlpdf_ios
description: Phần riêng iOS của Xử lý PDF ảnh - nhận dạng chữ Tesseract (kênh xlpdf/nhan_dang) và rung báo (kênh xlpdf/rung), cùng tên kênh với MainActivity.kt của bản Android.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: XlpdfIosPlugin
